name: 'Setup'
description: 'Install pnpm, Node.js, and the dependencies'

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        cache: true

    - name: Setup NodeJS
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'

    - name: Install dependencies
      shell: bash
      run: pnpm ci
